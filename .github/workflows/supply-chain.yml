name: supply-chain

on:
  pull_request:
    # `edited` covers a retargeted base, which changes what the gate compares against.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    uses: leanish/supply-chain/.github/workflows/supply-chain.yml@738ec358440bea0c85f6d5a5e59d2f9cd45667c6 # v0.6.0
    permissions:
      contents: read
    with:
      java-version: "17"
